name: Enrich market leaders

on:
  workflow_dispatch:
  schedule:
    - cron: "5 8 * * 1-5"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Dragon 1 and Dragon 2
        run: node scripts/enrich-leaders.mjs
      - name: Commit enriched leaders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/market-data.json docs/market-data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Enrich market leader snapshot"
          git push
