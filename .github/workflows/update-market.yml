name: Update market snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "35 7 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch and calculate market data
        run: |
          for attempt in 1 2 3; do
            if node scripts/update-market.mjs; then
              exit 0
            fi
            echo "Data source attempt $attempt failed; retrying shortly"
            sleep 30
          done
          exit 1
      - name: Commit refreshed snapshot
        run: |
          if [ -z "$(git status --porcelain -- public/market-data.json docs/market-data.json)" ]; then
            echo "No market data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/market-data.json docs/market-data.json
          git commit -m "Update market snapshot"
          git push
